<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="center-page">

<div class="card auth-card">
    <h1>👨‍💼 Employee Management</h1>
    <p>Sign in to continue.</p>

    <div class="alert success" th:if="${param.registered}">
        Registration successful. Please log in.
    </div>

    <div class="alert error" th:if="${param.error}">
        Invalid username or password.
    </div>

    <div class="alert success" th:if="${param.logout}">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button class="btn primary full" type="submit">Login</button>
    </form>

    <p>
        New user?
        <a th:href="@{/register}">Create an account</a>
    </p>
</div>

</body>
</html>
